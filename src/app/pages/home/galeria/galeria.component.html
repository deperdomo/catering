<section id="galeria" class="section" aria-labelledby="galeria-title">
  <div class="container">
    <h2 id="galeria-title">Lo que servimos</h2>

    <div class="mosaic">
      @for (p of photos; track p.img) {
        <figure>
          <img [src]="'img/web/' + p.img + '-960.webp'"
               [attr.srcset]="'img/web/' + p.img + '-480.webp 480w, img/web/' + p.img + '-960.webp 960w'"
               sizes="(min-width: 900px) 23vw, 50vw" width="960" [attr.height]="p.h" loading="lazy" [alt]="p.alt">
          <figcaption>{{ p.caption }}</figcaption>
        </figure>
      }
    </div>
  </div>
</section>
