<section id="servicios" class="section services" aria-labelledby="servicios-title">
  <div class="container">
    <h2 id="servicios-title">¿Qué va a celebrar?</h2>

    <div class="tabs" role="tablist" aria-label="Servicios" (keydown)="onKeydown($event)">
      @for (s of services; track s.id; let i = $index) {
        <button class="tab" role="tab" type="button"
                [id]="'tab-' + s.id" [attr.aria-controls]="'panel-' + s.id"
                [attr.aria-selected]="i === active()" [tabIndex]="i === active() ? 0 : -1"
                (click)="active.set(i)">{{ s.name }}</button>
      }
    </div>

    @for (s of services; track s.id; let i = $index) {
      <div class="panel" role="tabpanel" [id]="'panel-' + s.id" [attr.aria-labelledby]="'tab-' + s.id" [hidden]="i !== active()">
        <img class="panel__photo" [src]="'img/web/' + s.id + '-1320.webp'"
             [attr.srcset]="'img/web/' + s.id + '-720.webp 720w, img/web/' + s.id + '-1320.webp 1320w'"
             sizes="(min-width: 900px) 58vw, 100vw" width="1320" height="880" loading="lazy" [alt]="s.alt">
        <div class="panel__body">
          <h3>{{ s.name }}</h3>
          <p>{{ s.text }}</p>
          <button class="btn btn--primary" type="button" (click)="draft.start(s.tipo)">{{ s.cta }}</button>
        </div>
      </div>
    }
  </div>
</section>
