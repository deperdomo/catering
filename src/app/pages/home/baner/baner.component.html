<section id="inicio" class="hero" aria-labelledby="hero-title">
  <img class="hero__photo"
       src="img/web/hero-1620.webp"
       srcset="img/web/hero-960.webp 960w, img/web/hero-1620.webp 1620w"
       sizes="100vw" width="1620" height="1080" fetchpriority="high"
       alt="Un cortador sirve jamón junto a una mesa de aperitivos y flores blancas">

  <div class="container hero__content">
    <h1 id="hero-title">Catering para bodas, cumpleaños y empresas en Madrid</h1>
    <p class="hero__lede">Daniela, Henry y Pablo preparan su menú a medida, los aperitivos de presentación y los cócteles de su celebración.</p>

    <form class="quote-bar" (submit)="$event.preventDefault(); draft.start()" aria-label="Empezar un presupuesto">
      <label class="field">
        <span class="field__label">Tipo de evento</span>
        <select class="control" name="tipo" [(ngModel)]="draft.tipo">
          <option value="" disabled>Elija uno</option>
          @for (t of eventTypes; track t) { <option [value]="t">{{ t }}</option> }
        </select>
      </label>
      <label class="field">
        <span class="field__label">Fecha</span>
        <input class="control" type="date" name="fecha" [min]="today" [(ngModel)]="draft.fecha">
      </label>
      <label class="field">
        <span class="field__label">Invitados</span>
        <input class="control" type="number" name="invitados" min="1" inputmode="numeric" placeholder="Ej.: 80" [(ngModel)]="draft.invitados">
      </label>
      <button class="btn btn--primary" type="submit">Pedir presupuesto</button>
    </form>
  </div>
</section>
