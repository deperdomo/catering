<header class="header">
  <div class="container header__bar">
    <a class="logo" href="#inicio">Daniela Catering</a>

    <nav class="nav" aria-label="Principal">
      @for (item of links; track item.href) {
        <a class="nav__link" [href]="item.href">{{ item.label }}</a>
      }
    </nav>

    <a class="btn btn--primary header__cta" href="#presupuesto">Pedir presupuesto</a>

    <button class="menu-button" type="button" aria-controls="menu-movil"
            [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(!menuOpen())">
      <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="menu-movil" class="menu" aria-label="Principal">
      @for (item of links; track item.href) {
        <a class="menu__link" [href]="item.href" (click)="menuOpen.set(false)">{{ item.label }}</a>
      }
      <a class="menu__link" href="#presupuesto" (click)="menuOpen.set(false)">Pedir presupuesto</a>
    </nav>
  }
</header>

@if (showBottomBar()) {
  <div class="bottom-bar">
    <a class="btn btn--primary" href="#presupuesto">Pedir presupuesto</a>
  </div>
}
